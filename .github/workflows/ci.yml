name: CI

on:
  pull_request:
    paths:
      - '**.rs'
      - '**Cargo.toml'
      - '**Cargo.lock'
      # This file lists itself, unlike `lint.yml`: the jobs here run against a
      # toolchain this repository chooses, so a change to what installs that
      # toolchain is itself worth running.
      - '.github/workflows/ci.yml'
  push:
    paths:
      - '**.rs'
      - '**Cargo.toml'
      - '**Cargo.lock'
      - '.github/workflows/ci.yml'
  # The `paths` filters above mean that a change touching none of them — the
  # Zsh adapter under `zsh/`, docs, `packaging/**`, or Nix files — runs nothing
  # at all. Dispatch runs the jobs whatever the filter says, and is also how to
  # re-run something a newer push cancelled.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# One group per ref, so a newer push to a branch cancels the run it supersedes
# instead of both running to completion. The prefix is what keeps this from
# cancelling `lint.yml` or `packaging.yml` outright.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # Scoped to this job on purpose: this job installs sccache via
    # `.github/actions/setup-rust`. Setting RUSTC_WRAPPER workflow-wide would
    # make any job without that action fail to invoke rustc.
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: [stable, nightly]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install zsh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Show zsh version tested with
        run: zsh --version
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Build
        run: cargo build --locked --workspace --all-targets
      - name: Test
        run: cargo test --locked --workspace --all-targets

