name: "Setup Rust and Dependencies"
description: "Sets up sccache and the Rust toolchain for zsh-pulse"
inputs:
  toolchain:
    description: "Rust toolchain to install"
    required: false
    default: "stable"
  components:
    description: "Rust components to install"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    # sccache goes first so that every later step in the job resolves it through
    # PATH. `sccache-action` without a `version` input installs the current
    # release; pin `version` if you need a reproducible compiler cache key.
    - name: Setup sccache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable/v1
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
