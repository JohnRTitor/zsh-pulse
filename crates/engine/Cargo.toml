[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["highlight", "autocomplete", "history"]
highlight = []
autocomplete = ["dep:completion", "completion/autocomplete"]
history = ["dep:history", "dep:completion", "completion/history"]
history-navigation = ["history"]

[dependencies]
history = { workspace = true, optional = true }
completion = { workspace = true, optional = true }

[lints.rust]
missing_debug_implementations = "warn"