[package]
name = "zsh-module"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "shellpulse_highlight"
path = "src/lib.rs"
# The `rlib` is what lets the conversion cost be measured on its own:
# a `cdylib` alone cannot be linked into a benchmark.
crate-type = ["cdylib", "rlib"]

[dependencies]
zsh-abi.workspace = true
engine.workspace = true
lexer.workspace = true
highlight.workspace = true

[lints.rust]
missing_debug_implementations = "warn"