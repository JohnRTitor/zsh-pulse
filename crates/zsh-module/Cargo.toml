[package]
name = "zsh-module"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "zshpulse_core"
path = "src/lib.rs"
# The `rlib` is what lets the conversion cost be measured on its own:
# a `cdylib` alone cannot be linked into a benchmark.
crate-type = ["cdylib", "rlib"]

[features]
default = ["highlight", "autocomplete", "history"]
highlight = ["dep:highlight", "dep:lexer", "engine/highlight"]
autocomplete = ["dep:completion", "engine/autocomplete"]
history = ["dep:history", "dep:completion", "engine/history"]
history-navigation = ["history", "engine/history-navigation"]

[dependencies]
zsh-abi.workspace = true
engine = { workspace = true }
lexer = { workspace = true, optional = true }
highlight = { workspace = true, optional = true }
completion = { workspace = true, optional = true }
history = { workspace = true, optional = true }

[[example]]
name = "bench_region"
required-features = ["highlight"]

[lints.rust]
missing_debug_implementations = "warn"