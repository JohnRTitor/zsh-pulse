[workspace]
members = [
    "crates/zsh-abi",
    "crates/zsh-module",
    "crates/engine",
    "crates/lexer",
    "crates/highlight",
    "crates/ranking",
    "crates/history",
    "crates/completion",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
zsh-abi = { path = "crates/zsh-abi" }
engine = { path = "crates/engine" }
lexer = { path = "crates/lexer" }
highlight = { path = "crates/highlight" }
ranking = { path = "crates/ranking" }
history = { path = "crates/history" }
completion = { path = "crates/completion" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"   # must stay unwind: entry points rely on catch_unwind
